mbarrier_release_micro:
    exec_dir: "$GPUAPPS_ROOT/bin/$CUDA_VERSION/release/"
    data_dirs: "$GPUAPPS_ROOT/data_dirs/"
    execs:
        - mbarrier-release-count-many:
            exe: mbarrier_release_probe
            runs:
                - args: --case count_many --delay-cycles 4096
                  env:
                    CUDA_ARCH: sm_90a
                    ENABLE_TMA_DESC: 0
                    INTERMEDIATE_EXTRA_FILES_PERSISTANCE: 1
                  accel-sim-mem: 6G
                  qos: all
                  openmp-cpus: 2
        - mbarrier-release-count-alias:
            exe: mbarrier_release_probe
            runs:
                - args: --case count_alias --delay-cycles 4096
                  env:
                    CUDA_ARCH: sm_90a
                    ENABLE_TMA_DESC: 0
                    INTERMEDIATE_EXTRA_FILES_PERSISTANCE: 1
                  accel-sim-mem: 6G
                  qos: all
                  openmp-cpus: 2
        - mbarrier-release-tma-many:
            exe: mbarrier_release_probe
            runs:
                - args: --case tma_many --delay-cycles 4096
                  env:
                    CUDA_ARCH: sm_90a
                    ENABLE_TMA_DESC: 1
                    INTERMEDIATE_EXTRA_FILES_PERSISTANCE: 1
                  accel-sim-mem: 6G
                  qos: all
                  openmp-cpus: 2
        - mbarrier-release-tma-alias:
            exe: mbarrier_release_probe
            runs:
                - args: --case tma_alias --delay-cycles 4096
                  env:
                    CUDA_ARCH: sm_90a
                    ENABLE_TMA_DESC: 1
                    INTERMEDIATE_EXTRA_FILES_PERSISTANCE: 1
                  accel-sim-mem: 6G
                  qos: all
                  openmp-cpus: 2
