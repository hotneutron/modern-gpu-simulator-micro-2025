                    CUDA_ARCH: sm_90a
                    ENABLE_TMA_DESC: 1
                    INTERMEDIATE_EXTRA_FILES_PERSISTANCE: 1
                  accel-sim-mem: 6G
                  qos: all
                  openmp-cpus: 2
        - ublkred-size-64B:
